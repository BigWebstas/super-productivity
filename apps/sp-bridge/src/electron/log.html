<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>SP Bridge Log</title>
    <style>
      html, body { height: 100%; margin: 0; padding: 0; }
      body {
        font: 12px/1.5 ui-monospace, monospace;
        display: flex;
        flex-direction: column;
        background: #fff;
        color: #111;
      }
      #bar {
        padding: 8px 12px;
        border-bottom: 1px solid #ddd;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        background: #f8f8f8;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #bar label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
      #note { color: #666; font-size: 12px; margin-left: auto; }
      #log { flex: 1; overflow-y: auto; margin: 0; padding: 8px 12px; white-space: pre-wrap; word-break: break-all; }
      @media (prefers-color-scheme: dark) {
        body { background: #1e1e1e; color: #d4d4d4; }
        #bar { border-bottom-color: #333; background: #252526; color: #eee; }
        #note { color: #aaa; }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <label><input id="pause" type="checkbox" /> Pause</label>
      <span id="note"></span>
    </div>
    <pre id="log"></pre>
    <script>
      // Live: the main process pushes each line as it is written. "Pause"
      // freezes the view; un-pausing re-reads the file so nothing is missed.
      const MAX_LINES = 1000;
      const el = document.getElementById('log');
      const note = document.getElementById('note');
      const pauseBox = document.getElementById('pause');
      const api = window.spBridge;
      let lines = [];
      const render = () => {
        const countMsg = lines.length + ' line' + (lines.length === 1 ? '' : 's');
        note.textContent = pauseBox.checked ? 'Paused (' + countMsg + ')' : 'Live (' + countMsg + ')';
        const pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
        el.textContent = lines.length ? lines.join('\n') : '(log is empty)';
        if (pinned) {
          el.scrollTop = el.scrollHeight;
        }
      };
      const reload = () =>
        api
          .readLog()
          .then((tail) => {
            lines = tail.slice(-MAX_LINES);
            render();
            el.scrollTop = el.scrollHeight;
          })
          .catch((error) => {
            note.textContent = String((error && error.message) || error);
          });
      pauseBox.addEventListener('change', () => (pauseBox.checked ? render() : reload()));
      if (!api) {
        note.textContent = 'Log bridge is unavailable in this window.';
      } else {
        api.onLogLines((added) => {
          if (pauseBox.checked) {
            return;
          }
          lines = lines.concat(added).slice(-MAX_LINES);
          render();
        });
        reload();
      }
    </script>
  </body>
</html>
