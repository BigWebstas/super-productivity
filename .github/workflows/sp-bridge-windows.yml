name: SP Sync Agent (Windows installer)

# Builds the SP Sync Agent desktop installer from apps/sp-sync-agent.
#
# Scope is deliberately narrow: this workflow exists to produce a Windows
# installer for the agent, not to validate the Super Productivity app. It runs
# the agent's own gates (typecheck, tests, bundle) first, because every one of
# them has caught a real defect that a green build did not — see the "Traps"
# section of apps/sp-sync-agent/README.md.

on:
  push:
    branches:
      - sp-bridge
    paths:
      - 'apps/sp-sync-agent/**'
      - '.github/workflows/sp-bridge-windows.yml'
  pull_request:
    paths:
      - 'apps/sp-sync-agent/**'
      - '.github/workflows/sp-bridge-windows.yml'
  # Lets a maintainer kick a build without touching a file.
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight installer irrelevant.
  group: sp-bridge-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/sp-sync-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the root project's engine floor and the `node20` esbuild
          # target in scripts/build.mjs.
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/sp-sync-agent/package-lock.json

      # The repo install comes FIRST and is not optional.
      #
      # The agent type-checks and bundles Super Productivity's own sources, so
      # it needs the repo's dependencies (Angular, NgRx, typia, zod, rxjs, …).
      # They are resolved relative to the importing file — src/app/** and
      # packages/** — so only a root install puts them on the resolution path.
      # This is also what separates a green local type-check from a red CI one:
      # on a dev machine inside a worktree, that walk silently reaches the PARENT
      # checkout's node_modules, which does not exist on a fresh runner. See the
      # README's "Traps" section.
      #
      # --ignore-scripts is deliberate and safe here. The root `prepare` chain
      # runs husky, ts-patch, `npm run env` and builds the @sp/* dist packages;
      # none of it is needed, because the agent compiles the workspace packages
      # from TypeScript source via its own esbuild aliases rather than consuming
      # their dist output. The single patch-package patch targets a WebDAV
      # library that is not in the agent's import graph, and
      # src/environments/environment.ts is tracked in git rather than generated.
      - name: Install repo dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      # The agent's own manifest carries build and packaging tooling only
      # (esbuild, electron, electron-builder, typescript, prettier). `npm ci`
      # rather than `npm install` so the build is reproducible.
      - name: Install agent tooling
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Feasibility spike
        run: npm run spike

      - name: Generate icon
        run: npm run icon

      # Minified: the installer ships this file, and the source map is not
      # wanted inside a distributed artifact.
      - name: Bundle
        run: npm run build:min

      # electron-builder downloads the pinned Electron runtime and the NSIS
      # toolchain on first use.
      - name: Build installer
        run: npx electron-builder --config electron-builder.yaml --win --x64
        env:
          # Unsigned build. Stops electron-builder waiting on a signing
          # certificate it cannot find.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer exists
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(release/*.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no .exe in release/"
            ls -la release/ || true
            exit 1
          fi
          for f in "${installers[@]}"; do
            echo "installer: $f ($(du -h "$f" | cut -f1))"
          done

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: sp-sync-agent-windows-x64
          path: apps/sp-sync-agent/release/*.exe
          if-no-files-found: error
          retention-days: 30
